<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXCLUSIVE</title>
<link rel="icon" href="https://i.ibb.co/vCwwgQ2D/TRAP-removebg-preview.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f2ff;--dim:rgba(245,242,255,.55);--gold:#d4af37;--line:rgba(220,210,255,.16);}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);background:#050505;font-family:Outfit,sans-serif;}
.bgpic{position:fixed;inset:-28px;z-index:-3;background:url("https://imgur.com/a/CSrmoZX") center 42%/cover no-repeat;filter:brightness(.32) saturate(.85) contrast(1.05);transform:scale(1.04);}
.bgshade{position:fixed;inset:0;z-index:-2;background: linear-gradient(180deg,rgba(5,3,12,.18),rgba(8,5,18,.56) 56%,#07050d 100%),linear-gradient(90deg,rgba(5,3,12,.42),transparent 45%,rgba(5,3,12,.42));}
#gate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:rgba(4,4,4,.85);backdrop-filter:blur(10px);transition:opacity.6s ease;}
.gatebox{text-align:center;animation:fadeIn 1s ease;}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
#gobtn{padding:16px 40px;color:#fff;border:2px solid #d4af37;border-radius:12px;background:rgba(212,175,55,.1);box-shadow:0 0 20px rgba(212,175,55,.2);font:inherit;font-size:.8rem;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all.3s ease;}
#gobtn:hover{background:#d4af37;color:#000;box-shadow:0 8px 30px rgba(212,175,55,.6);transform:translateY(-3px);}
.wrap{width:100%;display:flex;flex-direction:column;align-items:center;padding-bottom:40px;opacity:0;transition:opacity.5s ease;padding-top:40px;}
.wrap.show{opacity:1}
.tag{margin:0 20px 0;color:var(--dim);font-size:.68rem;letter-spacing:1.5px;text-align:center;}
.rule{width:60px;height:2px;margin:30px 0 18px;background:var(--gold);}
#treeArea{width:min(1100px,calc(100% - 28px))}
.tier{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;}
.ttitle{z-index:2;margin-bottom:20px;color:#fff;font-size:.68rem;letter-spacing:5px;}
.messiah{margin-top:12px}
.roster{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;position:relative;z-index:2;}
.person{width:154px;min-height:210px;padding:12px 10px 10px;gap:5px;border-radius:12px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.13);background:rgba(5,5,7,.72);backdrop-filter:blur(10px);box-shadow:0 12px 28px rgba(0,0,0,.5);transition:transform.35s ease,box-shadow.35s ease,border-color.35s ease;}
.person:hover{border-color:rgba(212,175,55,.95);box-shadow: 0 18px 38px rgba(0,0,0,.65), 0 0 24px rgba(212,175,55,.3);transform:translateY(-5px);}
.pface{width:94px;height:94px;margin:0 auto;padding:4px;overflow:hidden;border-radius:50%;background:linear-gradient(135deg,#d4af37,#8b5cf6);box-shadow:0 7px 18px rgba(0,0,0,.55);}
.pface img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;}
.pplacard{width:100%;margin-top:8px;padding:8px;border:1px solid rgba(220,210,255,.14);border-radius:9px;background:rgba(255,255,255,.07);backdrop-filter:blur(12px);}
.pname{font-size:.76rem;font-weight:700;text-align:center}
.phandle{font-size:.57rem;color:var(--dim);text-align:center}
.pstatus{color:var(--gold);font-size:.55rem;margin-top:4px;text-align:center}
</style>
</head>
<body>
<div class="bgpic"></div>
<div class="bgshade"></div>

<div id="gate">
<div class="gatebox">
<button id="gobtn">Sa ngalan ng Exclusive. Amen.</button>
</div>
</div>

<main class="wrap">
<p class="tag">“exclusive owns u.”</p>
<div class="rule"></div>

<section id="treeArea">
<div class="tier">
<div class="ttitle">EXCLUSIVE</div>
<div class="roster">
<article class="person">
<div class="pface"><img src="https://i.imgur.com/NTcYvTj.jpeg"></div>
<div class="pplacard"><div class="pname">/$</div><div class="phandle">@htrb1734</div><div class="pstatus">offline</div></div>
</article>
<article class="person">
<div class="pface"><img src="https://i.imgur.com/AxucUUU.jpeg"></div>
<div class="pplacard"><div class="pname">bluntz</div><div class="phandle">@htrb1487</div><div class="pstatus">Online</div></div>
</article>
<article class="person">
<div class="pface"><img src="https://cdn.discordapp.com/avatars/1248736047643365458/avatar.png"></div>
<div class="pplacard"><div class="pname">SPINBACK/WAY2IC</div><div class="phandle">@htrb1428</div><div class="pstatus">Online</div></div>
</article>
</div>
</div>

<div class="tier">
<div class="ttitle messiah">LUVONES</div>
<div class="roster">
<article class="person">
<div class="pface"><img src="https://i.imgur.com/WKC5krx.jpeg"></div>
<div class="pplacard"><div class="pname">nicolez</div><div class="phandle">@loczzzz</div><div class="pstatus">Online</div></div>
</article>
<article class="person">
<div class="pface"><img src="https://i.imgur.com/97T8keB.jpeg"></div>
<div class="pplacard"><div class="pname">seb</div><div class="phandle">@sebvsall</div><div class="pstatus">Online</div></div>
</article>
</div>
</div>
</section>
</main>

<script>
var audio = new Audio();
audio.src = "./Hev Abi - MEDICAL (Audio) [Sm4KLgn4110].mp3";
audio.volume = 0.6;
audio.loop = true;

document.getElementById("gobtn").addEventListener("click",function(){
document.getElementById("gate").style.opacity="0";
document.querySelector(".wrap").classList.add("show");
audio.play().catch(function(e){console.log("Audio blocked:", e);});
setTimeout(function(){document.getElementById("gate").remove()},600);
});

document.addEventListener("pointermove",function(e){
if(!matchMedia("(pointer:fine)").matches)return;
var bg=document.querySelector(".bgpic");
var x=(e.clientX/innerWidth-.5)*7;
var y=(e.clientY/innerHeight-.5)*4;
bg.style.transform="scale(1.04) translate("+x+"px,"+y+"px)";
});
</script>
</body>
</html>
